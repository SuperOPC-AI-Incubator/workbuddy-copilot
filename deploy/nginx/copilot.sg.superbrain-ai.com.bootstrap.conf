server {
    listen 80;
    listen [::]:80;
    server_name copilot.sg.superbrain-ai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # The bootstrap site serves ACME only. The application is not exposed
    # before the certificate-backed production configuration is installed.
    location / {
        return 404;
    }
}
